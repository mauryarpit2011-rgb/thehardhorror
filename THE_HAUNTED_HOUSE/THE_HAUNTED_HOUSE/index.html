<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE HAUNTED HOUSE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#eee;font-family:Inter,system-ui,Arial}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#title{position:absolute;top:18px;left:20px;font-weight:800;letter-spacing:3px;text-shadow:0 2px 8px #000}
#objective{position:absolute;left:20px;bottom:24px;max-width:420px;padding:14px 16px;border-left:3px solid #c7c7c7;background:rgba(0,0,0,.52);font-size:15px;line-height:1.45}
#status{position:absolute;right:20px;top:18px;text-align:right;font-size:13px;text-shadow:0 2px 8px #000}
#hint{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);padding:8px 13px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.18);border-radius:5px;opacity:0;transition:.2s}
#cross{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border:1px solid #fff;border-radius:50%;opacity:.75}
#start{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:radial-gradient(circle at center,#222 0,#070707 65%,#000 100%)}
.card{width:min(680px,92vw);padding:38px;border:1px solid #444;background:rgba(10,10,10,.9);box-shadow:0 20px 80px #000;text-align:center}
.card h1{font-size:clamp(34px,7vw,72px);letter-spacing:8px;margin:0 0 10px}
.card p{color:#bbb;line-height:1.6}.btn{pointer-events:auto;cursor:pointer;background:#eee;color:#111;border:0;padding:13px 24px;font-weight:800;letter-spacing:1px}
#flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:10}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:15;transition:opacity 1s}
</style>
</head>
<body>
<div id="start"><div class="card">
<h1>THE HAUNTED HOUSE</h1>
<p>Five rooms. Two keys. Twelve objectives.<br>Something inside the house is watching.</p>
<p><b>WASD</b> move · <b>Mouse</b> look · <b>E</b> interact · <b>F</b> flashlight</p>
<button class="btn" id="play">ENTER THE HOUSE</button>
</div></div>
<div id="hud">
<div id="title">THE HAUNTED HOUSE</div><div id="status">FLASHLIGHT: OFF<br>KEYS: 0 / 2</div>
<div id="cross"></div><div id="objective">Objective: Enter the house.</div><div id="hint"></div>
</div><div id="flash"></div><div id="fade"></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x10151a);
scene.fog=new THREE.FogExp2(0x10151a,.018);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,120);
camera.position.set(0,1.7,13);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0x8da0b8,0x17130e,1.0); scene.add(hemi);
const moon=new THREE.DirectionalLight(0xa9c8ff,2.0); moon.position.set(-12,16,8); moon.castShadow=true; scene.add(moon);
moon.shadow.mapSize.set(1024,1024);

const mat=(c,r=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const wall=mat(0x5c554c), wood=mat(0x33251a), floor=mat(0x453226), metal=mat(0x55585b,.45), paper=mat(0xc6b98f), red=mat(0x5a2020), white=mat(0xd7d7d0);
function box(name,x,y,z,sx,sy,sz,m=wall,collide=true){
 const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.name=name;o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);
 if(collide) solids.push(o); return o;
}
const solids=[];
function lamp(x,z,color=0xffc875,intensity=2.2){
 const p=new THREE.PointLight(color,intensity,9,2);p.position.set(x,2.9,z);p.castShadow=true;scene.add(p);
 const bulb=new THREE.Mesh(new THREE.SphereGeometry(.09,12,12),new THREE.MeshBasicMaterial({color}));bulb.position.copy(p.position);scene.add(bulb);
 return p;
}
function room(cx,cz,w,d){
 box("floor",cx,-.12,cz,w,.2,d,floor,false);
 box("ceiling",cx,3.5,cz,w,.2,d,wall,false);
 box("wall",cx-w/2,1.7,cz,.2,3.4,d,wall);
 box("wall",cx+w/2,1.7,cz,.2,3.4,d,wall);
 box("wall",cx,1.7,cz-d/2,w,3.4,.2,wall);
 box("wall",cx,1.7,cz+d/2,w,3.4,.2,wall);
}
room(0,10,10,8); room(0,1,10,8); room(-10,1,8,8); room(10,1,8,8); room(0,-8,10,8);
// Doorway openings simulated by deleting some wall pieces visually via dark portals
box("portal",0,1.5,6,.9,3,.3,wood,false);
box("portal",-5,1.5,1,.9,3,.3,wood,false);
box("portal",5,1.5,1,.9,3,.3,wood,false);
box("portal",0,1.5,-4,.9,3,.3,wood,false);

for(let i=0;i<18;i++){ const x=(Math.random()-.5)*8, z=10+(Math.random()-.5)*6; box("furniture",x,.5,z,.8+Math.random()*1.2,1+Math.random(),.5,wood); }
box("table",0,.8,1,3,.15,1.2,wood); box("cabinet",-2,.9,9,1.2,1.8,.6,wood);
box("counter",-10,.8,0,6,.15,1.2,wood); box("cabinet",10,.9,0,5,1.8,.6,wood);
box("bed",2,.35,-8,3.5,.7,5.2,wood); box("wardrobe",-2,1.4,-9,1.6,2.8,.8,wood);

for(let x=-3;x<=3;x+=3) lamp(x,10);
lamp(-2,1);lamp(2,1);lamp(-10,1);lamp(10,1);lamp(0,-8);
const candle1=lamp(0,-8,0xffb34e,1.1);

const flashlight=new THREE.SpotLight(0xe9f2ff,0,24,Math.PI/8,.45,1.2);
flashlight.position.set(0,1.7,13); flashlight.castShadow=true; scene.add(flashlight); scene.add(flashlight.target);

const keys={}; addEventListener("keydown",e=>{keys[e.code]=true;if(e.code==="KeyF")toggleFlash(); if(e.code==="KeyE")interact();});
addEventListener("keyup",e=>keys[e.code]=false);
let locked=false;
renderer.domElement.addEventListener("click",()=>{if(start.style.display==="none")renderer.domElement.requestPointerLock()});
document.addEventListener("mousemove",e=>{if(!locked)return; yaw-=e.movementX*.0022; pitch-=e.movementY*.0018; pitch=Math.max(-1.35,Math.min(1.35,pitch));});
document.addEventListener("pointerlockchange",()=>locked=document.pointerLockElement===renderer.domElement);
let yaw=0,pitch=0,flashOn=false;
function toggleFlash(){flashOn=!flashOn;flashlight.intensity=flashOn?5.5:0;updateHud();}
function forward(){return new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));}
function tryMove(dx,dz){
 const p=camera.position.clone();p.x+=dx;p.z+=dz;
 if(p.x<-14||p.x>14||p.z<-13||p.z>15)return;
 // simple collision against furniture/solid boxes
 const r=.32; let blocked=false;
 for(const s of solids){const b=new THREE.Box3().setFromObject(s);if(p.x>b.min.x-r&&p.x<b.max.x+r&&p.z>b.min.z-r&&p.z<b.max.z+r&&p.y<b.max.y+.1) {blocked=true;break;}}
 if(!blocked)camera.position.copy(p);
}
const objectives=[
"Explore the Entrance Hall and discover the first clue.",
"Find the flashlight.",
"Search the Living Room for the hidden note.",
"Find the small object containing a code.",
"Enter the Kitchen and locate the hidden switch.",
"Activate the electrical system.",
"Find the first key.",
"Use the first key to unlock the basement door.",
"Explore the basement and find the second clue.",
"Solve the object-placement puzzle to reveal the second key.",
"Use the second key to unlock the bedroom.",
"Find the final escape mechanism and escape."
];
let obj=0, hasFlash=false,key1=false,key2=false,code=false,power=false,bedOpen=false,escaped=false;
const interactables=[];
function item(name,x,y,z,color=0xffffff){const o=new THREE.Mesh(new THREE.BoxGeometry(.35,.35,.35),mat(color));o.name=name;o.position.set(x,y,z);o.castShadow=true;scene.add(o);interactables.push(o);return o;}
const clue=item("Clue",0,1.2,12,paper.color.getHex()); const codeObj=item("Code",2,1.1,2,0x6e7b82);
const switchObj=item("Switch",-10,1.3,2,0x333333); const keyA=item("Key A",-1.8,.65,9,0xcaa84b);
const keyB=item("Key B",0,.9,-8,0xcaa84b); keyA.visible=false;keyB.visible=false;
const flashObj=item("Flashlight",1,1.1,11,0x20252a);
function setObjective(n){obj=Math.min(n,11);document.getElementById("objective").textContent="Objective "+(obj+1)+"/12: "+objectives[obj];}
function dist(a,b){return a.distanceTo(b)}
function interact(){
 let best=null,bd=2.2;
 for(const o of interactables)if(o.visible){const d=dist(camera.position,o.position);if(d<bd){bd=d;best=o}}
 if(!best)return;
 if(best===clue&&obj===0){clue.visible=false;setObjective(1);show("A cold draft follows the clue...");}
 else if(best===flashObj&&obj===1){flashObj.visible=false;hasFlash=true;setObjective(2);show("The flashlight still works.");}
 else if(best===codeObj&&obj===2){codeObj.visible=false;code=true;setObjective(3);show("A number is scratched into the object: 417.");}
 else if(best===switchObj&&obj===4){switchObj.visible=false;power=true;setObjective(5);show("Power restored. Something moved upstairs.");}
 else if(best===keyA&&obj===6){keyA.visible=false;key1=true;setObjective(7);show("First key acquired.");}
 else if(best===keyB&&obj===9){keyB.visible=false;key2=true;setObjective(10);show("Second key acquired.");}
 else if(best===bedDoor&&obj===10){bedOpen=true;bedDoor.rotation.y=-Math.PI/2;setObjective(11);show("The bedroom opens. Find the escape mechanism.");}
 else if(best===exitObj&&obj===11){escaped=true;finish();}
}
function show(t){const h=document.getElementById("hint");h.textContent=t;h.style.opacity=1;setTimeout(()=>h.style.opacity=0,2200)}
let bedDoor=box("Locked Bedroom Door",0,1.5,-4,1.5,3,.25,wood,false); interactables.push(bedDoor);
let exitObj=item("Escape Mechanism",0,1.1,-10,0x7b2d2d);

function updateHud(){document.getElementById("status").innerHTML=`FLASHLIGHT: ${flashOn?"ON":"OFF"}<br>KEYS: ${(key1?1:0)+(key2?1:0)} / 2`;}
setObjective(0);updateHud();

let ghost=new THREE.Group();ghost.position.set(8,0,7);
const gmat=new THREE.MeshStandardMaterial({color:0xb8b8b0,roughness:.9});
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.7,8,16),gmat);body.position.y=1.25;ghost.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.43,20,16),gmat);head.position.y=2.55;ghost.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.47,16,12),new THREE.MeshStandardMaterial({color:0x111111,roughness:1}));hair.scale.set(1.05,.9,.7);hair.position.set(0,2.68,.12);ghost.add(hair);
for(const x of [-.15,.15]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),new THREE.MeshBasicMaterial({color:0xf2f2d0}));eye.position.set(x,2.55,-.4);ghost.add(eye);}
ghost.visible=false;scene.add(ghost);

let ghostState="roaming",ghostTimer=0;
function updateGhost(dt){
 if(!power && obj<5)return;
 ghostTimer+=dt;
 if(!ghost.visible && ghostTimer>7){ghost.visible=true;ghost.position.set((Math.random()<.5?-1:1)*9,0,Math.random()*12-4);ghostTimer=0;ghostState="watching";}
 if(!ghost.visible)return;
 const d=ghost.position.distanceTo(camera.position);
 if(d<7){ghostState="stalking"; if(flashOn){ghost.visible=false;ghostTimer=-2;return}}
 if(d<4){ghostState="chasing"} 
 if(ghostState==="chasing"){
   const dir=camera.position.clone().sub(ghost.position);dir.y=0;dir.normalize();ghost.position.addScaledVector(dir,dt*1.8);
   if(d<1.25){show("The presence forces you back...");camera.position.set(0,1.7,13);ghost.position.set(9,0,8);ghostState="roaming";ghostTimer=-4;}
 }else if(ghostState==="stalking"){
   const dir=camera.position.clone().sub(ghost.position);dir.y=0;dir.normalize();ghost.position.addScaledVector(dir,dt*.45);
 }else{
   ghost.rotation.y+=dt*.15;
 }
 ghost.lookAt(camera.position.x,1.5,camera.position.z);
}

function finish(){
 document.exitPointerLock?.();document.getElementById("fade").style.opacity=1;
 setTimeout(()=>{document.getElementById("start").style.display="grid";document.querySelector("#start h1").textContent="YOU ESCAPED";document.querySelector("#start p").innerHTML="The house falls silent.<br><br>The ghost watches from an upstairs window.";document.querySelector("#play").textContent="PLAY AGAIN";},900);
}
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(start.style.display==="none"){
  const dir=forward(),right=new THREE.Vector3(-dir.z,0,dir.x);let speed=3.2;
  let mx=0,mz=0;if(keys.KeyW){mx+=dir.x;mz+=dir.z}if(keys.KeyS){mx-=dir.x;mz-=dir.z}if(keys.KeyA){mx-=right.x;mz-=right.z}if(keys.KeyD){mx+=right.x;mz+=right.z}
  const len=Math.hypot(mx,mz);if(len)tryMove(mx/len*speed*dt,mz/len*speed*dt);
  camera.rotation.order="YXZ";camera.rotation.y=yaw;camera.rotation.x=pitch;
  flashlight.position.copy(camera.position);flashlight.target.position.copy(camera.position).add(forward().multiplyScalar(5));
  updateGhost(dt);
  // Progress gates
  if(obj===3 && camera.position.x>6 && camera.position.z>-3 && camera.position.z<5)setObjective(4);
  if(obj===5){keyA.visible=true;setObjective(6)}
  if(obj===7 && camera.position.z<-4)setObjective(8);
  if(obj===8 && camera.position.z<-6){keyB.visible=true;setObjective(9)}
  if(obj===9 && camera.position.distanceTo(keyB.position)<2.3)show("Place the matching object near the old bed.");
  if(obj===10 && camera.position.z<-6)bedDoor.visible=true;
  if(power && Math.random()<dt*.06){candle1.intensity=1.1+Math.random()*1.5}
 }
 renderer.render(scene,camera);requestAnimationFrame(loop);
}
const start=document.getElementById("start");
document.getElementById("play").onclick=()=>{start.style.display="none";camera.position.set(0,1.7,13);setObjective(0);document.getElementById("fade").style.opacity=0;renderer.domElement.requestPointerLock()};
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
requestAnimationFrame(loop);
</script>
</body></html>
